# fly.toml app configuration file generated for chm-automotive-jsfb6a on 2026-11-02T08:29:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'chm-automotive-jsfb6a'
primary_region = 'cdg'

[build]

[env]
  PORT = '8000'

[[mounts]]
  source = 'donnees'
  destination = '/app/donnees'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

app = "chm-automotive"
primary_region = "ams"

[build]

[env]
  PORT = "8000"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[mounts]
  source = "donnees"
  destination = "/app/donnees"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
